name: Supabase migration dry run

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migration-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'skieevents' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dgyabshzcacostpuswxs
    steps:
      - name: Checkout proposed migration
        uses: actions/checkout@v4

      - name: Verify dry-run credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          test -n "${SUPABASE_PROJECT_ID}"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Verify Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.110.0"

      - name: Link Supabase project read-only for migration preview
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Inspect applied migration history
        shell: bash
        run: |
          set -o pipefail
          supabase migration list 2>&1 | tee migration-history.log

      - name: Preview pending migrations without applying
        shell: bash
        run: |
          set -o pipefail
          supabase db push --dry-run --include-all 2>&1 | tee migration-dry-run.log

      - name: Upload migration dry-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-dry-run-${{ github.sha }}
          path: |
            migration-history.log
            migration-dry-run.log
          if-no-files-found: warn
          retention-days: 7
